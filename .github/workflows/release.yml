name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0) — overrides tag'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Determine version ────────────────────────────────────────────────────
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

  # ─── Build .deb (Ubuntu) ──────────────────────────────────────────────────
  build-deb:
    name: Build .deb
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Install deps
        run: |
          sudo apt update -qq
          sudo apt install -y -qq libgtk-4-dev libadwaita-1-dev dpkg-dev

      - name: Build .deb
        run: |
          sed -i "s/^Version: .*/Version: ${{ needs.version.outputs.version }}/" packaging/debian/control
          sed -i "s/^PKG_VER=.*/PKG_VER=\"${{ needs.version.outputs.version }}\"/" packaging/make-deb.sh
          bash packaging/make-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: doumi-deb
          path: target/doumi_*_amd64.deb
          if-no-files-found: error

  # ─── Build Arch package (in Arch container) ───────────────────────────────
  build-arch:
    name: Build Arch package
    needs: version
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          pacman -Syu --noconfirm --needed base-devel rust gtk4 libadwaita git

      - name: Build package
        run: |
          useradd -m builder
          cp -r "$GITHUB_WORKSPACE" /home/builder/doumi
          chown -R builder:builder /home/builder/doumi
          su builder -c "
            cd /home/builder/doumi/packaging/arch
            sed -i \"s/^pkgver=.*/pkgver=${{ needs.version.outputs.version }}/\" PKGBUILD
            sed -i 's|^source=.*|source=(\"file:///home/builder/doumi\")|' PKGBUILD
            makepkg -sf --noconfirm
          "

      - name: Find and copy artifact
        run: |
          PKG=$(find /home/builder/doumi/packaging/arch -name 'doumi-*.pkg.tar.*' -type f | head -1)
          echo "Package: $PKG"
          cp "$PKG" /tmp/doumi.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: doumi-arch
          path: /tmp/doumi.pkg.tar.zst
          if-no-files-found: error

  # ─── GitHub Release ───────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [version, build-deb, build-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: doumi-deb

      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: doumi-arch

      - name: Rename artifacts
        run: |
          mv doumi_*_amd64.deb  doumi_${{ needs.version.outputs.version }}_amd64.deb  2>/dev/null || true
          mv doumi.pkg.tar.zst   doumi-${{ needs.version.outputs.version }}-1-x86_64.pkg.tar.zst 2>/dev/null || true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ needs.version.outputs.version }}"
          files: |
            doumi_*.deb
            doumi-*.pkg.tar.zst
          generate_release_notes: true

  # ─── Deploy apt repo to GitHub Pages ──────────────────────────────────────
  deploy-apt:
    name: Deploy apt repo → GitHub Pages
    needs: [version, build-deb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: doumi-deb

      - name: Build apt repository
        run: |
          bash packaging/apt-repo.sh init
          bash packaging/apt-repo.sh add doumi_*_amd64.deb

          # Export GPG public key for users
          if [ -n "${{ secrets.APT_GPG_PUBLIC_KEY }}" ]; then
            echo "${{ secrets.APT_GPG_PUBLIC_KEY }}" > apt-repo/gpg.key
          fi

          # Sign if we have the private key
          if [ -n "${{ secrets.APT_GPG_PRIVATE_KEY }}" ]; then
            export GPG_PRIVATE_KEY="${{ secrets.APT_GPG_PRIVATE_KEY }}"
            bash packaging/apt-repo.sh sign
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apt-repo
          destination_dir: debian

  # ─── Deploy Arch repo to GitHub Pages ─────────────────────────────────────
  deploy-arch:
    name: Deploy Arch repo → GitHub Pages
    needs: [version, build-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: doumi-arch

      - name: Build Arch repository
        run: |
          mkdir -p arch-repo
          cp doumi.pkg.tar.zst arch-repo/

          # Create repo database
          cd arch-repo
          repo-add doumi.db.tar.gz doumi.pkg.tar.zst

          # Export GPG public key if available
          if [ -n "${{ secrets.APT_GPG_PUBLIC_KEY }}" ]; then
            echo "${{ secrets.APT_GPG_PUBLIC_KEY }}" > gpg.key
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: arch-repo
          destination_dir: arch
          keep_files: true
